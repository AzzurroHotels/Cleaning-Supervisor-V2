<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#376546"><title>Submitted reports</title>
<style>*{box-sizing:border-box}body{font:16px/1.5 system-ui;color:#273e30;background:#f5f5f0;margin:0}main{max-width:900px;margin:auto;padding:clamp(16px,3vw,32px)}h1{font-size:clamp(25px,4vw,32px);margin:0 0 8px}input,button{font:inherit;min-height:46px;border-radius:8px;border:1px solid #ccd4c6;padding:10px 14px}input{width:100%;max-width:320px}button{background:#376546;color:#fff;border-color:#376546;cursor:pointer}article{background:#fff;border:1px solid #dce1d7;border-radius:12px;margin:14px 0;padding:6px 18px}summary{cursor:pointer;min-height:44px;padding:10px 0;font-weight:600}.muted{color:#687468;font-size:14px}.fail{border-left:3px solid #a83f32;padding-left:12px;margin:14px 0}.ok{color:#2a6b3c;font-weight:600}.bad{color:#a43f30;font-weight:600}.wait{color:#8a5a1b;font-weight:600}button.link{min-height:36px;background:#fff;color:#376546;font-size:14px;padding:4px 10px}.note{background:#f5f5f0;border-radius:8px;padding:10px 12px;white-space:pre-wrap}h3{font-size:16px;margin:18px 0 8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px system-ui}.media{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.media img,.media video{width:100%;height:150px;object-fit:contain;background:#eee;border-radius:8px}#err{color:#a43f30}</style>
<main><h1>Submitted reports</h1><form id="login"><p class="muted">Enter the management password to view reports.</p><input id="pw" type="password" autocomplete="current-password" aria-label="Management password" required> <button>View reports</button></form><p id="err" role="status"></p><div id="out"></div></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let password='';
async function media(m,el){try{const r=await fetch('/api/media?id='+encodeURIComponent(m.id),{headers:{authorization:'Bearer '+password}});if(!r.ok)throw 0;const u=URL.createObjectURL(await r.blob());el.innerHTML='<img src="'+u+'" alt="Failure photo">'}catch{el.textContent='Could not load '+(m.name||'photo')}}
const badge=d=>d.status==='sent'?'<span class="ok">sent to WhatsApp</span>':d.status==='failed'?'<span class="bad">WhatsApp failed: '+esc(d.error||'')+'</span>':'<span class="wait">waiting to send'+(d.error?' ('+esc(d.error)+')':'')+'</span>';
async function resend(id,btn){btn.disabled=true;const r=await fetch('/api/resend',{method:'POST',headers:{authorization:'Bearer '+password,'content-type':'application/json'},body:JSON.stringify({id})});btn.textContent=r.ok?'Queued':'Could not resend'}
$('login').onsubmit=async e=>{
  e.preventDefault();password=$('pw').value;$('err').textContent='Loading…';
  try{
    const r=await fetch('/api/reports',{headers:{authorization:'Bearer '+password}}),j=await r.json();
    if(!r.ok)throw Error(j.error||'Could not load reports');
    $('err').textContent=j.reports.length?'':'No reports submitted yet.';
    $('login').hidden=true;
    $('out').innerHTML=j.reports.map((r,i)=>'<article><details><summary>'+esc(r.date)+' — '+esc(r.name)+' <span class="muted">· '+r.failures.length+' failure(s)'+((r.areaNotes||[]).length?' · '+r.areaNotes.length+' note(s)':'')+' · submitted '+esc(new Date(r.submittedAt).toLocaleString())+'</span></summary><p>'+badge(r.delivery||{})+' <button type="button" class="link" onclick="resend(\''+r.id+'\',this)">Send PDF to WhatsApp again</button></p>'+r.failures.map((f,k)=>'<div class="fail"><strong>'+esc(f.location)+'</strong>'+(f.status==='pass'?' <span class="muted">(passed after recheck)</span>':'')+'<p>'+esc(f.notes)+'</p><div class="media" data-r="'+i+'" data-f="'+k+'"></div></div>').join('')+((r.areaNotes||[]).length?'<h3>Area notes</h3>'+r.areaNotes.map(n=>'<p class="note"><strong>'+esc(n.floor)+' — '+esc(n.area)+'</strong><br>'+esc(n.note)+'</p>').join(''):'')+'<details><summary>Full checklist</summary><pre>'+esc(r.summary)+'</pre></details></details></article>').join('');
    document.querySelectorAll('.media').forEach(el=>j.reports[el.dataset.r].failures[el.dataset.f].media.forEach(m=>{const d=document.createElement('div');el.append(d);media(m,d)}));
  }catch(err){$('err').textContent=err.message}
};
</script></html>
