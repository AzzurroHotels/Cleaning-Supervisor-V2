name: allen-cleaning-supervisor

services:
  app:
    build: .
    image: allen-cleaning-supervisor:latest
    restart: unless-stopped
    init: true
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: ${TZ:-UTC}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      SESSION_DAYS: ${SESSION_DAYS:-7}
    volumes:
      - allen-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  allen-data:
